# fly.toml app configuration file for TravelSats alby-lite deployment
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'travelsats-alby-lite'
primary_region = 'gru'

[build]

[env]
  BASE_URL = 'https://travelsats.ar'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/ping'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
